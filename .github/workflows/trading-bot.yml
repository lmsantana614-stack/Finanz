name: Trading-Bot

on:
  schedule:
    - cron: '*/5 * * * *'   # alle 5 Minuten (kürzer erlaubt GitHub nicht)
  workflow_dispatch:         # manuell starten: Actions -> Trading-Bot -> Run workflow

permissions:
  contents: write   # Stand im Zweig "data" speichern
  issues: write     # Signale als Issue-Kommentar melden (-> Push-Benachrichtigung)

concurrency:
  group: trading-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Letzten Stand laden
        run: |
          # Der Bot-Stand liegt im Zweig "data" (immer nur ein Commit, damit das Repo klein bleibt).
          # Gibt es ihn noch nicht, wird der Stand aus main übernommen.
          if git fetch --depth=1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- bot STATUS.md 2>/dev/null || true
            git reset -q
          fi

      - name: Bot ausführen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRYPTOCOMPARE_KEY: ${{ secrets.CRYPTOCOMPARE_KEY }}
        run: node bot/run.js

      - name: Stand speichern
        run: |
          git config user.name "trading-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan data-new
          git read-tree --empty
          git add -f STATUS.md bot/*.json
          git commit -qm "Bot-Stand $(TZ=Europe/Berlin date '+%d.%m. %H:%M')"
          git push -f origin HEAD:data
