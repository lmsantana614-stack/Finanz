name: Quellen-Test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: TradingView prüfen
        run: |
          COLS='["name","close","currency","change","Perf.W","high","low","RSI|60","MACD.macd|60","MACD.signal|60","EMA20|60","EMA50|60","BB.lower|60","BB.upper|60","Volatility.D","current_session","update_mode","market_cap_basic","change|60"]'
          p() { echo "=== $1"; curl -s -m 20 -X POST -H 'Content-Type: application/json' -A "Mozilla/5.0" -d "$3" "https://scanner.tradingview.com/$2/scan" | head -c 2500; echo; }
          p america america "{\"symbols\":{\"tickers\":[\"NASDAQ:AAPL\",\"NASDAQ:NVDA\"]},\"columns\":$COLS}"
          p germany germany "{\"symbols\":{\"tickers\":[\"XETR:SAP\",\"XETR:RHM\"]},\"columns\":$COLS}"
          p vix cfd '{"symbols":{"tickers":["TVC:VIX","FX_IDC:EURUSD"]},"columns":["close","change"]}'
          p global global "{\"symbols\":{\"tickers\":[\"XETR:SAP\",\"NASDAQ:AAPL\"]},\"columns\":[\"close\",\"currency\",\"current_session\"]}"
          echo "=== cboe -L"; curl -sL -m 20 -A "Mozilla/5.0" "https://cdn.cboe.com/api/global/delayed_quotes/quotes/_VIX.json" | head -c 300; echo
          echo "=== nasdaq hist"; curl -s -m 20 -A "Mozilla/5.0" "https://api.nasdaq.com/api/quote/AAPL/historical?assetclass=stocks&fromdate=2026-10-01&limit=5" | head -c 400; echo
